<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="../brand/favicon.png">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
<title>3DACTION · اکشن سه‌بعدی</title>
<style>
  :root { --bg: #f3f3f1; --card: #fff; --text: #1b1b1b; --muted: #6e6e6b; --line: #e2e2de; --accent: #202020; --ink: #fff; --danger: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1a1a1a; --text: #f2f2f0; --muted: #9b9b97; --line: #2b2b2b; --accent: #f2f2f0; --ink: #141414; --danger: #ff8a80; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { min-height: 100svh; display: grid; place-items: center; padding: 16px; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; text-align: center; }
  .box { width: 100%; max-width: 360px; }
  .logo { width: 150px; height: auto; margin: 0 auto 18px; display: block; filter: drop-shadow(0 14px 30px rgba(0,0,0,.3)); }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 900; }
  p { color: var(--muted); margin: 0 0 18px; font-size: 14px; line-height: 1.8; }
  .spinner { width: 26px; height: 26px; margin: 4px auto 0; border: 3px solid var(--accent); border-left-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px; text-align: center; outline: none; margin-bottom: 12px; direction: ltr; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; padding: 14px; border: 0; border-radius: 14px; font: inherit; font-weight: 900; font-size: 16px; color: var(--ink); background: var(--accent); cursor: pointer; }
  .err { color: var(--danger); font-size: 14px; min-height: 22px; margin-bottom: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="../brand/logo.png" alt="3DACTION">
  <h1>آرش خوش آمدی</h1>

  <div id="wait">
    <p id="msg">در حال پیدا کردن سایت…</p>
    <div class="spinner"></div>
  </div>

  <form id="login" class="hidden">
    <p>رمز سایت رو یه بار وارد کن؛ این گوشی یادش می‌مونه</p>
    <input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button type="submit">ورود</button>
  </form>
</div>
<script>window.WHO = "arash"; window.ROOT = "../";</script>
<script src="../go.js"></script>
</body>
</html>
