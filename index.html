<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1013">
<title>قیمت پرینت سه‌بعدی</title>
<style>
  :root { --bg: #f3f5f4; --card: #fff; --text: #121614; --muted: #66706b; --line: #dfe5e1; --accent: #17945f; --accent-2: #12b37a; --ink: #fff; --soft: #e3f4ec; --danger: #c0352b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1013; --card: #161b1f; --text: #edf1ef; --muted: #8f9a95; --line: #252c31; --accent: #2fc285; --accent-2: #4fe0a2; --ink: #062016; --soft: #14281f; --danger: #ff8d82; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { min-height: 100svh; display: grid; place-items: center; padding: 16px; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; text-align: center; }
  .box { width: 100%; max-width: 360px; }
  .logo { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 16px; display: grid; place-items: center; color: var(--ink);
    background: linear-gradient(140deg, var(--accent-2), var(--accent)); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 18px; font-size: 14px; line-height: 1.8; }
  .spinner { width: 26px; height: 26px; margin: 4px auto 0; border: 3px solid var(--accent); border-left-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px; text-align: center; outline: none; margin-bottom: 12px; direction: ltr; }
  input:focus { border-color: var(--accent); }
  button { width: 100%; padding: 14px; border: 0; border-radius: 14px; font: inherit; font-weight: 800; font-size: 16px; color: var(--ink); background: linear-gradient(140deg, var(--accent-2), var(--accent)); cursor: pointer; }
  .err { color: var(--danger); font-size: 14px; min-height: 22px; margin-bottom: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg></div>
  <h1>قیمت پرینت سه‌بعدی</h1>

  <div id="wait">
    <p id="msg">در حال پیدا کردن سایت…</p>
    <div class="spinner"></div>
  </div>

  <form id="login" class="hidden">
    <p>رمز سایت رو یه بار وارد کن؛ این گوشی یادش می‌مونه</p>
    <input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button type="submit">ورود</button>
  </form>
</div>
<script>
  // The laptop writes its current public link into link.txt whenever it reconnects.
  const API = "https://api.github.com/repos/mannyedy/print/contents/link.txt";
  const KEY = "print_quote_token";
  const $ = (id) => document.getElementById(id);
  const store = { get() { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } },
                  set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} } };
  let tries = 0, site = "";

  async function currentLink() {
    try {
      const r = await fetch(API + "?t=" + Date.now(), { cache: "no-store", headers: { Accept: "application/vnd.github.raw" } });
      if (r.ok) return (await r.text()).trim();
    } catch {}
    const r = await fetch("link.txt?t=" + Date.now(), { cache: "no-store" });
    return (await r.text()).trim();
  }

  async function health(url, token) {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch(url + "/api/health?t=" + encodeURIComponent(token), { cache: "no-store", signal: ctl.signal });
      return r.ok ? await r.json() : null;
    } catch { return null; } finally { clearTimeout(timer); }
  }

  function go(url, token) { location.replace(url + "/" + (token ? "#t=" + token : "")); }

  async function attempt() {
    tries++;
    try {
      site = await currentLink();
      if (!/^https:\/\//.test(site)) throw 0;
      const h = await health(site, store.get());
      if (h && h.ok) {
        if (h.token_ok) return go(site, store.get());
        store.set("");
        $("wait").classList.add("hidden"); $("login").classList.remove("hidden"); $("pw").focus();
        return;
      }
    } catch {}
    $("msg").textContent = tries < 3 ? "در حال پیدا کردن سایت…"
      : "لپ‌تاپ هنوز وصل نیست؛ داره دوباره وصل می‌شه. همین صفحه رو باز بذار، خودش امتحان می‌کنه…";
    setTimeout(attempt, tries < 10 ? 6000 : 15000);
  }

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault(); $("err").textContent = "";
    try {
      // a text/plain body keeps this a simple cross-origin request (no preflight)
      const r = await fetch(site + "/api/token", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
      const d = await r.json();
      if (!r.ok) { $("err").textContent = d.error || "رمز اشتباه است"; return; }
      store.set(d.token); go(site, d.token);
    } catch { $("err").textContent = "اتصال برقرار نشد؛ دوباره امتحان کن"; }
  });

  attempt();
</script>
</body>
</html>
